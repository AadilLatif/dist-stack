[project]
name = "dist-dashboard"
version = "0.1.0"
description = "Read-only visibility browser over the dist-stack ecosystem stores (runstore, KG, registry)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dist-stack-model-registry",
    "streamlit>=1.49",
    "pandas>=2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
dist-stack-model-registry = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/dist-dashboard"]
