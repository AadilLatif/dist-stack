[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dist-workflow-runner"
version = "0.1.0"
description = "MCP workflow-runner for the NREL distribution suite: runs versioned JSON workflows across the domain MCP servers (gdm, gdm_flow, erad, ditto, shift) with a runstore-backed provenance trail."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "NREL Distribution Suite" }]
dependencies = [
    "mcp>=2.0,<3",
    "dist-stack-model-registry",
    "pyyaml",
]

[tool.uv.sources]
dist-stack-model-registry = { workspace = true }

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
workflow-runner = "workflow_runner.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
